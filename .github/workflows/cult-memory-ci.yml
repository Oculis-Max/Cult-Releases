name: Cult Memory CI

on:
  push:
    branches:
      - hackathon/cult-memory
      - main
    paths:
      - 'cult-memory/**'
      - '.github/workflows/cult-memory-ci.yml'
  pull_request:
    paths:
      - 'cult-memory/**'
      - '.github/workflows/cult-memory-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cult-memory
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: cult-memory/go.mod

      - name: Resolve modules
        run: go mod tidy

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...
