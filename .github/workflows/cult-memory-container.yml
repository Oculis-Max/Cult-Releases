name: Publish Cult Memory Container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cult-memory/**'
      - '.github/workflows/cult-memory-container.yml'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/oculis-max/cult-memory
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/Oculis-Max/Cult-Releases
            org.opencontainers.image.title=Cult Memory
            org.opencontainers.image.description=Agentic memory demo using Cult and CockroachDB

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./cult-memory
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
